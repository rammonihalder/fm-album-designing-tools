<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MM Album Design Tools</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="panel">
    <header class="header">
      <div>
        <div class="eyebrow">MM</div>
        <h1>MM Album Design Tools</h1>
      </div>
      <span class="version">v0.6.0</span>
    </header>

    <section class="tools-section" aria-label="Album Design Tools">
      <button id="openPsdBtn" class="btn primary full" data-tool="open-psd">
        OPEN PSD
      </button>
      <button id="autoPhotoFillBtn" class="btn primary full" data-tool="auto-photo-fill">
        AUTO PHOTO FILL
      </button>
      <button id="swapPhotosBtn" class="btn primary full" data-tool="swap-photos">
        SWAP PHOTOS
      </button>
      <button id="savePageBtn" class="btn primary full" data-tool="save-page">
        SAVE PAGE
      </button>
      <button id="saveEditedPhotosBtn" class="btn primary full" data-tool="save-edited-photos">
        SAVE EDITED PHOTOS
      </button>
    </section>

    <div id="statusText" class="status-text" aria-live="polite" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <dialog id="savePageDialog">
    <div class="save-page-dialog-content">
      <label for="savePagePrefixInput">
        Prefix (optional)
      </label>
      <input
        id="savePagePrefixInput"
        type="text"
        placeholder="e.g. Riya"
        autocomplete="off"
      />
      <div
        id="savePagePrefixError"
        hidden
      >
        Invalid prefix
      </div>
      <div class="save-page-dialog-actions">
        <button id="savePageDialogSaveBtn" class="btn primary" type="button">
          SAVE
        </button>
        <button id="savePageDialogCancelBtn" class="btn" type="button">
          CANCEL
        </button>
      </div>
    </div>
  </dialog>

  <dialog id="editedPhotosDeviceDialog">
    <div class="device-dialog-content">
      <div class="device-dialog-header">
        <h2>Computer Type</h2>
        <p>This computer is:</p>
      </div>
      <div class="device-dialog-actions">
        <button id="editedPhotosDeviceLaptopBtn" class="btn primary full" type="button">
          LAPTOP - LT
        </button>
        <button id="editedPhotosDeviceDesktopBtn" class="btn primary full" type="button">
          DESKTOP - DT
        </button>
        <button id="editedPhotosDeviceCancelBtn" class="btn full" type="button">
          CANCEL
        </button>
      </div>
    </div>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
