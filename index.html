<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MM Album Design Tools</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="panel">
    <header class="header">
      <div>
        <div class="eyebrow">MM</div>
        <h1>MM Album Design Tools</h1>
      </div>
      <span class="version">v0.3.0</span>
    </header>

    <section class="tools-section" aria-label="Album Design Tools">
      <button id="autoPhotoFillBtn" class="btn primary full" data-tool="auto-photo-fill">
        AUTO PHOTO FILL
      </button>
      <button id="swapPhotosBtn" class="btn primary full" data-tool="swap-photos">
        SWAP PHOTOS
      </button>
    </section>

    <div id="statusText" class="status-text" aria-live="polite" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
